 const seq=k=='cancel'?[[330,0],[247,.25]]:k=='ready'?[[784,0],[988,.15],[1175,.3]]:[[880,0],[1175,.2],[880,.4],[1175,.6]];

 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}

<div class="card row"><input id="dn" placeholder="Новое блюдо" style="flex:1;min-width:180px"><input id="dpz" type="number" placeholder="цена" style="width:90px"><select id="dst">${so('kitchen')}</select><button class="btn s" onclick="addD()">Добавить</button></div>
<small>Блюда не удаляются, чтобы не ломать отчёты. Ненужное блюдо отметьте «Стоп»: официант не сможет его заказать, а гости увидят «нет в наличии». Состав и фото показываются в гостевом меню.</small>`}
async function upPh(id,f){if(!f)return;const img=await createImageBitmap(f),k=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.82)),path=`d${id}-${Date.now()}.jpg`,{error}=await sb.storage.from('menu').upload(path,b,{contentType:'image/jpeg'});if(error)return alert(error.message);
await upD(id,{photo:sb.storage.from('menu').getPublicUrl(path).data.publicUrl})}

async function gsv(){const L=await q(sb.from('links').select('*').order('pos')),u=location.href.replace(/[^/]*([?#].*)?$/,'')+'guest.html';
return`<div class="card"><b>Ссылка для NFC-метки и QR-кода</b><div class="row"><input value="${E(u)}" readonly style="flex:1;min-width:220px" onclick="this.select()"><a class="btn s" href="${E(u)}" target="_blank">Открыть</a></div><small>Общая ссылка: меню без привязки к столу (для QR на входе, в Instagram).</small></div>

async function addu(){const l=$('#nl').value.trim().toLowerCase(),nm=$('#nn').value.trim(),pw=$('#npw').value;
if(l.length<4||pw.length<4)return alert('Логин и пароль — от 4 символов');
