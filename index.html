<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Niet Café</title><meta name="theme-color" content="#5f8553">
<style>
:root{--bg:#f2f6ec;--tx:#2f4a2a;--mu:#6d8566;--g:#5f8553;--au:#b98d35;--ln:#d2dfc4;--rd:#b8453f;color-scheme:light}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px Lora,Georgia,serif}button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}header b{flex:1}
main{max-width:980px;margin:auto;padding:14px}.btn,.chip,.tb button{border:1px solid var(--ln);background:#fff;border-radius:12px;padding:8px 14px;cursor:pointer}.btn{background:var(--g);color:#fff;border:0;font-weight:700}.btn.o{background:#fff;color:var(--g);border:1px solid var(--g)}.btn.r{background:var(--rd)}.btn.s{padding:5px 10px;font-size:13px}
.on{background:var(--g)!important;color:#fff!important;border-color:var(--g)!important}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:12px;margin:8px 0}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.tbl{padding:18px 8px;text-align:center;border-radius:16px;border:1px solid var(--ln);background:#fff;font-weight:700;cursor:pointer}.tbl.bz{background:#f6e7c8;border-color:var(--au)}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--ln);cursor:pointer}.dh span{color:#9a6b1c;font-weight:700}
input,select{border:1px solid var(--ln);border-radius:10px;padding:8px;background:#fff;max-width:100%}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:14px;display:block;overflow-x:auto}th,td{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:right}th:first-child,td:first-child{text-align:left}th{background:#e8f0df}
.bad{color:var(--rd);font-weight:700}.ok{color:var(--g);font-weight:700}.tk{border-left:6px solid var(--au)}.tk.cook{border-color:var(--g)}
.lg{max-width:340px;margin:60px auto;text-align:center;display:grid;gap:10px;padding:0 14px}
.sheet{position:fixed;inset:0;background:#0006;z-index:9;display:flex;align-items:center;justify-content:center;padding:14px}.sheet>div{background:var(--bg);border-radius:18px;padding:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
@media print{header,.tb,.btn,.chip{display:none!important}}
.tbl small{display:block;font-weight:400;color:var(--mu)}.tk.late{border-left-color:var(--rd)}
</style></head><body><div id="app"></div><div id="md"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ВСТАВЬТЕ СВОИ ДАННЫЕ из Supabase: Project Settings -> API (Project URL и anon public key) */
const URL_='https://iamomamsltqfpeljahuy.supabase.co',KEY='sb_publishable_4l_mW-_FDstSX2IhEtjvSQ_kf0rr55J';
const sb=supabase.createClient(URL_,KEY),$=s=>document.querySelector(s),M=n=>Math.round(n||0).toLocaleString('ru-RU')+'\u00a0₸';

const RN={waiter:'Официант',kitchen:'Кухня',bar:'Бар',store:'Склад',boss:'Руководитель',none:'Без роли'};

const dp=id=>+(D.find(d=>d.id==id)||{}).price||0,dn=id=>(D.find(d=>d.id==id)||{}).name||'';
const hd=()=>`<header><b>${RN[me.role]} · ${E(me.name)}</b><button class="btn o s" onclick="out()">Выйти</button></header>`;
const tabs=(a,d)=>{tab=tab||d;return`<div class="row tb">${a.map(([k,n])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()">${n}</button>`).join('')}</div>`};
function login(){$('#app').innerHTML=`<div class="lg"><h2>Niet Café</h2><input id="u" placeholder="Логин" autocapitalize="off"><input id="p" type="password" placeholder="Пароль" onkeydown="event.key=='Enter'&&go()"><button class="btn" onclick="go()">Войти</button><p id="er" class="bad"></p></div>`}
async function go(){const{error}=await sb.auth.signInWithPassword({email:$('#u').value.trim().toLowerCase()+'@niet.cafe',password:pp($('#p').value)});if(error)return $('#er').textContent=(/invalid login/i.test(error.message)?'Неверный логин или пароль':'Ошибка: '+error.message);init()}
async function out(){await sb.auth.signOut();me=null;login()}
async function init(){const{data:{session}}=await sb.auth.getSession();if(!session)return login();
const{data}=await sb.from('profiles').select('*').eq('id',session.user.id).single();me=data;tab='';tbl=0;
if(!me||me.role=='none'){$('#app').innerHTML=(me?hd():'')+'<main><p>Роль не назначена. Обратитесь к руководителю.</p></main>';return}
[C,D]=await Promise.all([q(sb.from('cats').select('*').order('id')),q(sb.from('dishes').select('*').order('id'))]);cat=C[0]?C[0].id:0;
if(ch)sb.removeChannel(ch);if(['waiter','kitchen','bar'].includes(me.role))ch=sb.channel('r').on('postgres_changes',{event:'*',schema:'public',table:'order_items'},()=>render()).subscribe();render()}
async function render(){const h={waiter:wv,kitchen:()=>kv('kitchen'),bar:()=>kv('bar'),store:sv,boss:bv}[me.role];const x=await h();$('#app').innerHTML=hd()+'<main>'+x+'</main>'}
/* ---- официант ---- */
async function wv(){const bz={};(await q(sb.from('orders').select('tbl,order_items(dish_id,qty)').eq('status','open'))).forEach(o=>bz[o.tbl]=o.order_items.reduce((a,i)=>a+i.qty*dp(i.dish_id),0));
if(!tbl)return`<div class="g2">${[...Array(20)].map((_,i)=>`<div class="tbl ${bz[i+1]!=null?'bz':''}" onclick="tbl=${i+1};render()">Стол ${i+1}${bz[i+1]!=null?`<small>${M(bz[i+1])}</small>`:''}</div>`).join('')}</div>`;
const o=await q(sb.from('orders').select('*,order_items(*)').eq('tbl',tbl).eq('status','open').maybeSingle()),it=o?o.order_items:[],sum=it.reduce((a,i)=>a+i.qty*dp(i.dish_id),0);
return`<button class="btn o s" onclick="tbl=0;render()">← Столы</button><h3>Стол ${tbl}</h3><div class="two"><div><div class="row">${C.map(c=>`<button class="chip ${cat==c.id?'on':''}" onclick="cat=${c.id};render()">${E(c.name)}</button>`).join('')}</div><input placeholder="🔍 Поиск блюда" value="${E(sq)}" oninput="sq=this.value;$('#dl').innerHTML=dl()" style="width:100%"><div id="dl">${dl()}</div></div><div class="card">${it.map(i=>`<div class="dh" style="cursor:default"><span style="color:inherit;font-weight:400;flex:1">${E(dn(i.dish_id))}</span><small class="${i.status=='ready'?'ok':''}">${SL[i.status]}</small>${i.status=='new'?`<button class="btn o s" onclick="qt(${i.id},${i.qty-1})">−</button>`:''}<b>${i.qty}</b>${i.status=='new'?`<button class="btn o s" onclick="qt(${i.id},${i.qty+1})">+</button>`:''}</div>`).join('')||'Пусто'}<h4>Итого: ${M(sum)}</h4>${it.length?`<button class="btn" onclick="pay('cash')">Наличные</button> <button class="btn" onclick="pay('card')">Карта</button>`:''}</div></div>`}
async function add(id){let o=await q(sb.from('orders').select('id').eq('tbl',tbl).eq('status','open').maybeSingle());if(!o)o=await q(sb.from('orders').insert({tbl}).select().single());await q(sb.from('order_items').insert({order_id:o.id,tbl,dish_id:id,station:D.find(x=>x.id==id).station}));render()}
const del=async id=>{await q(sb.from('order_items').delete().eq('id',id));render()};
const pay=async m=>{const o=await q(sb.from('orders').select('id').eq('tbl',tbl).eq('status','open').single());await q(sb.from('orders').update({status:'closed',pay:m}).eq('id',o.id));tbl=0;render()};
/* ---- кухня / бар ---- */
async function kv(s){const r=await q(sb.from('order_items').select('*').eq('station',s).neq('status','ready').order('created')),g={};r.forEach(i=>(g[i.tbl]=g[i.tbl]||[]).push(i));
return`<p><b>В работе: ${r.length}</b></p>`+(Object.entries(g).map(([t,a])=>{const m=Math.floor((Date.now()-new Date(a[0].created))/6e4);return`<div class="card tk ${m>15?'late':''}"><div class="row"><b style="flex:1;font-size:18px">Стол ${t}</b><span class="${m>15?'bad':''}">${m} мин</span></div>${a.map(i=>`<div class="dh" style="cursor:default"><span style="color:inherit;font-weight:400"><b>${i.qty}×</b> ${E(dn(i.dish_id))}</span><span>${i.status=='new'?`<button class="btn s" onclick="st(${i.id},'cooking')">Готовится</button> `:'<small class="ok">готовится</small> '}<button class="btn s" onclick="st(${i.id},'ready')">Готово</button></span></div>`).join('')}</div>`}).join('')||'<p>Заказов нет</p>')}
const st=async(id,s)=>{await q(sb.from('order_items').update({status:s}).eq('id',id));render()};
/* ---- склад ---- */
const stT=P=>`<table><tr><th>Продукт</th><th>Склад</th><th>Кухня</th><th>Бар</th><th>Всего</th><th>Мин.</th><th>Цена</th></tr>${P.map(p=>`<tr><td>${E(p.name)}, ${E(p.unit)}</td>${['s_main','s_kitchen','s_bar'].map(k=>`<td class="${p[k]<0?'bad':''}">${+(+p[k]).toFixed(3)}</td>`).join('')}<td class="${tot3(p)<+p.min_qty?'bad':''}">${+tot3(p).toFixed(3)}</td><td><input type="number" step="any" style="width:70px" value="${p.min_qty||0}" onchange="upd('products',${p.id},{min_qty:+this.value})"></td><td>${M(p.price)}</td></tr>`).join('')}</table>`;
const opt=P=>P.map(p=>`<option value="${p.id}">${E(p.name)} (${E(p.unit)})</option>`).join('');
async function sv(){const P=await q(sb.from('products').select('*').order('name')),h=tabs([['st','Остатки'],['buy','Закупки'],['in','Приход'],['out','Выдача'],['jr','Журнал']],'st');
if(tab=='buy'){const L=P.filter(p=>tot3(p)<+p.min_qty);window.BL=L.map(p=>p.name+': '+(+(p.min_qty-tot3(p)).toFixed(2))+' '+p.unit);return h+(L.length?`<table><tr><th>Продукт</th><th>Сейчас</th><th>Мин.</th><th>Докупить</th></tr>${L.map(p=>`<tr><td>${E(p.name)}</td><td>${+tot3(p).toFixed(2)}</td><td>${p.min_qty}</td><td class="bad">${+(p.min_qty-tot3(p)).toFixed(2)} ${E(p.unit)}</td></tr>`).join('')}</table><div class="row"><button class="btn o s" onclick="copy(BL)">Скопировать список</button></div>`:'<p>Все запасы выше минимума. Минимум задаётся во вкладке «Остатки».</p>')}
if(tab=='in')return h+`<div class="card row"><select id="ip">${opt(P)}</select><input id="iq" type="number" step="any" placeholder="кол-во"><input id="ic" type="number" placeholder="цена за ед."><button class="btn" onclick="mv('in')">Принять</button></div>`;
if(tab=='out')return h+`<div class="card row"><select id="ip">${opt(P)}</select><input id="iq" type="number" step="any" placeholder="кол-во"><select id="ot"><option value="s_kitchen">на кухню</option><option value="s_bar">в бар</option></select><button class="btn" onclick="mv('out')">Выдать</button></div>`;
if(tab=='jr'){const J=await q(sb.from('movements').select('*').order('t',{ascending:false}).limit(40));return h+`<table><tr><th>Время</th><th>Операция</th><th>Детали</th></tr>${J.map(m=>`<tr><td>${new Date(m.t).toLocaleString('ru')}</td><td>${E(m.kind)}</td><td>${E(m.info)}</td></tr>`).join('')}</table>`}
return h+stT(P)+`<div class="card row"><input id="np" placeholder="Новый продукт"><input id="nu" placeholder="ед." style="width:60px"><input id="npr" type="number" placeholder="цена" style="width:90px"><button class="btn s" onclick="addp()">Добавить</button></div>`}
async function mv(k){const id=$('#ip').value,n=+$('#iq').value;if(!(n>0))return;const p=await q(sb.from('products').select('*').eq('id',id).single());let u,t;
if(k=='in'){const c=+$('#ic').value;u={s_main:+p.s_main+n};if(c>0)u.price=c;t=`+${n} ${p.unit}`}else{const to=$('#ot').value;u={s_main:p.s_main-n,[to]:+p[to]+n};t=`${n} ${p.unit} → ${to=='s_bar'?'бар':'кухня'}`}
await q(sb.from('products').update(u).eq('id',id));await q(sb.from('movements').insert({kind:k=='in'?'Приход':'Выдача',info:p.name+': '+t}));tab='st';render()}
async function addp(){const name=$('#np').value;if(!name)return;await q(sb.from('products').insert({name,unit:$('#nu').value||'кг',price:+$('#npr').value||0}));render()}
/* ---- руководитель ---- */
async function bv(){const h=tabs([['db','Сводка'],['rp','Отчёты'],['mn','Меню'],['cl','Калькуляция'],['or','Заказы'],['wh','Продукты'],['us','Сотрудники'],['sx','Затраты']],'db');
return h+await({db,rp:rep,mn,cl,or:ors,wh:pe,us:usr,sx})[tab]()}
async function rep(){const from=per?new Date(Date.now()-per*864e5).toISOString():'1970-01-01';
const[O,R,P,S]=await Promise.all([q(sb.from('orders').select('closed,order_items(dish_id,qty)').eq('status','closed').gte('closed',from)),q(sb.from('recipes').select('*')),q(sb.from('products').select('id,price')),q(sb.from('settings').select('*'))]);
const s=Object.fromEntries(S.map(x=>[x.key,+x.val])),pr=Object.fromEntries(P.map(p=>[p.id,+p.price])),cost={},m={};R.forEach(r=>cost[r.dish_id]=(cost[r.dish_id]||0)+r.qty*(pr[r.product_id]||0));let rev=0,cg=0;
O.forEach(o=>o.order_items.forEach(i=>{const d=D.find(x=>x.id==i.dish_id),r=m[i.dish_id]||(m[i.dish_id]={n:d.name,q:0,rv:0,c:0}),c=i.qty*(cost[i.dish_id]||0);r.q+=i.qty;r.rv+=i.qty*d.price;r.c+=c;rev+=i.qty*d.price;cg+=c}));
const days=per||Math.max(1,Math.ceil((Date.now()-Math.min(Date.now(),...O.map(o=>+new Date(o.closed))))/864e5)),fx=(s.labor+s.rent+s.util)/30*days,np=rev-cg-fx;LR={per,rev,cg,fx,np,rows:Object.values(m)};
return`<div class="row">${[[1,'Сегодня'],[7,'7 дней'],[30,'30 дней'],[0,'Всё время']].map(([k,n])=>`<button class="chip ${per==k?'on':''}" onclick="per=${k};render()">${n}</button>`).join('')}<button class="btn o s" onclick="csv()">CSV</button><button class="btn o s" onclick="print()">Печать</button></div><div class="g2"><div class="card">Выручка<br><b>${M(rev)}</b></div><div class="card">Продукты<br><b>${M(cg)}</b></div><div class="card">Валовая прибыль<br><b>${M(rev-cg)}</b></div><div class="card">Постоянные затраты (${days} дн.)<br><b>${M(fx)}</b></div><div class="card">Итоговая прибыль<br><b class="${np<0?'bad':'ok'}">${M(np)}</b></div><div class="card">Чеков<br><b>${O.length}</b></div></div><table><tr><th>Блюдо</th><th>Порций</th><th>Выручка</th><th>Продукты</th><th>Прибыль</th></tr>${Object.values(m).sort((a,b)=>b.rv-a.rv).map(r=>`<tr><td>${E(r.n)}</td><td>${r.q}</td><td>${M(r.rv)}</td><td>${M(r.c)}</td><td>${M(r.rv-r.c)}</td></tr>`).join('')||'<tr><td colspan="5">Нет закрытых заказов</td></tr>'}</table>`}
async function ors(){const O=await q(sb.from('orders').select('*,order_items(dish_id,qty)').order('id',{ascending:false}).limit(30));
return`<table><tr><th>№</th><th>Стол</th><th>Статус</th><th>Сумма</th></tr>${O.map(o=>`<tr><td>${o.id}</td><td>${o.tbl}</td><td>${o.status=='closed'?'закрыт · '+(o.pay=='card'?'карта':'нал'):'открыт'}</td><td>${M(o.order_items.reduce((a,i)=>a+i.qty*dp(i.dish_id),0))}</td></tr>`).join('')}</table>`}
async function usr(){const U=await q(sb.from('profiles').select('*').order('name')),ro=v=>Object.entries(RN).map(([k,n])=>`<option value="${k}" ${k==v?'selected':''}>${n}</option>`).join('');
return`<table><tr><th>Логин</th><th>Роль</th></tr>${U.map(u=>`<tr><td>${E(u.name)}</td><td><select onchange="setr('${u.id}',this.value)">${ro(u.role)}</select></td></tr>`).join('')}</table><div class="card row"><input id="nl" placeholder="Логин (4 цифры)" maxlength="4" inputmode="numeric" style="width:140px"><input id="npw" placeholder="Пароль (4 цифры)" maxlength="4" inputmode="numeric" style="width:150px"><button class="btn o s" onclick="gen()">🎲 Случайные</button><select id="nr">${ro('waiter')}</select><button class="btn s" onclick="addu()">Создать</button></div><small>Роль «Без роли» закрывает доступ сотруднику.</small>`}
const setr=async(id,r)=>{await q(sb.from('profiles').update({role:r}).eq('id',id))};
async function addu(){const l=$('#nl').value.trim(),w=$('#npw').value;if(!/^\d{4}$/.test(l)||!/^\d{4}$/.test(w))return alert('Логин и пароль — ровно по 4 цифры');
const c=supabase.createClient(URL_,KEY,{auth:{persistSession:false,autoRefreshToken:false}}),{data,error}=await c.auth.signUp({email:l+'@niet.cafe',password:pp(w)});if(error)return alert(error.message);
await q(sb.from('profiles').update({role:$('#nr').value}).eq('id',data.user.id));alert('Сотрудник создан.\nЛогин: '+l+'\nПароль: '+w+'\nЗапишите: потом пароль посмотреть нельзя.');render()}
async function sx(){const S=await q(sb.from('settings').select('*')),n={labor:'Персонал (ФОТ)',rent:'Аренда',util:'Коммунальные',portions:'План порций'};
return`<div class="card">${S.map(x=>`<div class="row"><span style="width:180px">${n[x.key]||x.key}</span><input type="number" value="${x.val}" onchange="setv('${x.key}',this.value)"></div>`).join('')}</div>`}
const setv=(k,v)=>q(sb.from('settings').update({val:+v}).eq('key',k));
/* ---- меню, техкарты, калькуляция, продукты (руководитель) ---- */
let LR=null;
async function ld(){[C,D]=await Promise.all([q(sb.from('cats').select('*').order('id')),q(sb.from('dishes').select('*').order('id'))])}
async function upd(t,id,v,r){await q(sb.from(t).update(v).eq('id',id));await ld();if(r)render()}
const cs=()=>`<div class="row"><b>Категория:</b><select onchange="cat=+this.value;render()">${C.map(c=>`<option value="${c.id}" ${c.id==cat?'selected':''}>${E(c.name)}</option>`).join('')}</select></div>`;
const so=v=>`<option value="kitchen" ${v=='kitchen'?'selected':''}>Кухня</option><option value="bar" ${v=='bar'?'selected':''}>Бар</option>`;
async function mn(){return`<div class="card"><h4>Категории</h4>${C.map(c=>`<div class="row"><input value="${E(c.name)}" onchange="upd('cats',${c.id},{name:this.value})"></div>`).join('')}<div class="row"><input id="nc" placeholder="Новая категория"><button class="btn s" onclick="addc()">Добавить</button></div></div>${cs()}<table><tr><th>Блюдо</th><th>Цена</th><th>Станция</th><th>Категория</th><th>В меню</th></tr>${D.filter(d=>d.cat_id==cat).map(d=>`<tr><td><input value="${E(d.name)}" onchange="upd('dishes',${d.id},{name:this.value})"></td><td><input type="number" style="width:90px" value="${d.price}" onchange="upd('dishes',${d.id},{price:+this.value})"></td><td><select onchange="upd('dishes',${d.id},{station:this.value})">${so(d.station)}</select></td><td><select onchange="upd('dishes',${d.id},{cat_id:+this.value},1)">${C.map(c=>`<option value="${c.id}" ${c.id==d.cat_id?'selected':''}>${E(c.name)}</option>`).join('')}</select></td><td><input type="checkbox" ${d.active!==false?'checked':''} onchange="upd('dishes',${d.id},{active:this.checked})"></td></tr>`).join('')}</table><div class="card row"><input id="dn" placeholder="Новое блюдо"><input id="dpr" type="number" placeholder="цена" style="width:90px"><select id="ds">${so('kitchen')}</select><button class="btn s" onclick="addd()">Добавить</button></div><small>Снятое с галочки блюдо исчезает у официантов, история заказов сохраняется.</small>`}
async function addc(){const n=$('#nc').value;if(!n)return;await q(sb.from('cats').insert({id:Math.max(0,...C.map(c=>c.id))+1,name:n}));await ld();render()}
async function addd(){const n=$('#dn').value;if(!n)return;await q(sb.from('dishes').insert({id:Math.max(0,...D.map(d=>d.id))+1,cat_id:cat,name:n,price:+$('#dpr').value||0,station:$('#ds').value}));await ld();render()}
async function cl(){const[R,P,S]=await Promise.all([q(sb.from('recipes').select('*')),q(sb.from('products').select('id,price')),q(sb.from('settings').select('*'))]);
const s=Object.fromEntries(S.map(x=>[x.key,+x.val])),ov=(s.labor+s.rent+s.util)/Math.max(1,s.portions),pr=Object.fromEntries(P.map(p=>[p.id,+p.price])),ing={};R.forEach(r=>ing[r.dish_id]=(ing[r.dish_id]||0)+r.qty*(pr[r.product_id]||0));const has=new Set(R.map(r=>r.dish_id));
return cs()+`<p>Накладные на порцию: (персонал + аренда + коммунальные) / план порций = <b>${M(ov)}</b></p><table><tr><th>Блюдо</th><th>Цена</th><th>Продукты</th><th>Накладные</th><th>Себест.</th><th>Маржа</th><th>%</th></tr>${D.filter(d=>d.cat_id==cat).map(d=>{const i=ing[d.id]||0,c=i+ov,m=d.price-c;return`<tr><td><a href="#" onclick="rec(${d.id});return false">${E(d.name)}</a></td><td>${M(d.price)}</td><td>${has.has(d.id)?M(i):'<small>нет техкарты</small>'}</td><td>${M(ov)}</td><td>${M(c)}</td><td class="${m<0?'bad':'ok'}">${M(m)}</td><td class="${m<0?'bad':'ok'}">${d.price?Math.round(m/d.price*100):0}%</td></tr>`}).join('')}</table>`}
async function rec(id){const[R,P]=await Promise.all([q(sb.from('recipes').select('*').eq('dish_id',id)),q(sb.from('products').select('id,name,unit,price').order('name'))]);const pn=Object.fromEntries(P.map(p=>[p.id,p])),cost=R.reduce((a,r)=>a+r.qty*(pn[r.product_id]?pn[r.product_id].price:0),0);
$('#md').innerHTML=`<div class="sheet"><div><h3>Техкарта: ${E(dn(id))}</h3>${R.map(r=>`<div class="row"><span style="flex:1">${E(pn[r.product_id].name)} (${E(pn[r.product_id].unit)})</span><input type="number" step="any" style="width:90px" value="${r.qty}" onchange="sr(${id},${r.product_id},this.value)"><button class="btn r s" onclick="dr(${id},${r.product_id})">×</button></div>`).join('')||'<p>Ингредиентов нет</p>'}<div class="row"><select id="rp">${opt(P)}</select><input id="rq" type="number" step="any" placeholder="на порцию" style="width:110px"><button class="btn o s" onclick="sr(${id},+$('#rp').value,$('#rq').value)">+ Добавить</button></div><p>Продукты на порцию: <b>${M(cost)}</b></p><button class="btn" onclick="$('#md').innerHTML='';render()">Готово</button></div></div>`}
const sr=async(d,p,v)=>{await q(sb.from('recipes').upsert({dish_id:d,product_id:p,qty:+v}));rec(d)};
const dr=async(d,p)=>{await q(sb.from('recipes').delete().eq('dish_id',d).eq('product_id',p));rec(d)};
async function pe(){const P=await q(sb.from('products').select('*').order('name')),u=(id,f,v)=>`upd('products',${id},{${f}:${v}})`;
return`<table><tr><th>Продукт</th><th>Ед.</th><th>Цена</th><th>Склад</th><th>Кухня</th><th>Бар</th></tr>${P.map(p=>`<tr><td><input value="${E(p.name)}" onchange="${u(p.id,'name','this.value')}"></td><td><input style="width:55px" value="${E(p.unit)}" onchange="${u(p.id,'unit','this.value')}"></td><td><input type="number" style="width:90px" value="${p.price}" onchange="${u(p.id,'price','+this.value')}"></td>${['s_main','s_kitchen','s_bar'].map(k=>`<td><input type="number" step="any" style="width:80px" value="${+(+p[k]).toFixed(3)}" onchange="${u(p.id,k,'+this.value')}"></td>`).join('')}</tr>`).join('')}</table><div class="card row"><input id="np" placeholder="Новый продукт"><input id="nu" placeholder="ед." style="width:60px"><input id="npr" type="number" placeholder="цена" style="width:90px"><button class="btn s" onclick="addp()">Добавить</button></div><small>Приход и выдачу ведёт кладовщик; здесь руководитель правит названия, цены и остатки вручную.</small>`}
function csv(){if(!LR)return;const r=[['Показатель','Значение'],['Выручка',LR.rev],['Продукты',LR.cg],['Постоянные затраты',LR.fx],['Итоговая прибыль',LR.np],[],['Блюдо','Порций','Выручка','Продукты','Прибыль'],...LR.rows.map(x=>[x.n,x.q,x.rv,x.c,x.rv-x.c].map(v=>typeof v=='number'?Math.round(v):v))];
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.map(x=>x.map(v=>`"${v}"`).join(';')).join('\n')],{type:'text/csv'}));a.download='niet-report.csv';a.click()}

let sq='';const SL={new:'новый',cooking:'готовится',ready:'готово'},tot3=p=>+p.s_main+ +p.s_kitchen+ +p.s_bar,copy=a=>navigator.clipboard.writeText(a.join('\n'));
const dl=()=>D.filter(d=>d.active!==false&&(sq?d.name.toLowerCase().includes(sq.toLowerCase()):d.cat_id==cat)).map(d=>`<div class="dh" onclick="add(${d.id})">${E(d.name)}<span>${M(d.price)}</span></div>`).join('');

async function db(){const f7=new Date(Date.now()-6*864e5);f7.setHours(0,0,0,0);
const[O,OP,P]=await Promise.all([q(sb.from('orders').select('closed,order_items(dish_id,qty)').eq('status','closed').gte('closed',f7.toISOString())),q(sb.from('orders').select('id').eq('status','open')),q(sb.from('products').select('*'))]);
const day=d=>new Date(d).toLocaleDateString('ru'),t0=day(Date.now()),dr={},top={};
O.forEach(o=>{const k=day(o.closed);dr[k]=(dr[k]||0)+o.order_items.reduce((a,x)=>a+x.qty*dp(x.dish_id),0);if(k==t0)o.order_items.forEach(i=>top[i.dish_id]=(top[i.dish_id]||0)+i.qty)});

setInterval(()=>{if(me&&['kitchen','bar'].includes(me.role))render()},30000);
