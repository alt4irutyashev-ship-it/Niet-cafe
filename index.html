ibOn=()=>{try{return Date.now()-(+localStorage.getItem('ibx')||0)>6048e5}catch(e){return true}},
ibx=()=>{try{localStorage.setItem('ibx',Date.now())}catch(e){}const b=$('#ib');b&&b.remove()},

 const det=(t,h,o)=>`<details ${o?'open':''}><summary><b>${t}</b></summary>${h}</details>`,

 pc=`<ol><li>В <b>Chrome</b> или <b>Edge</b> нажмите значок установки в правой части адресной строки (монитор со стрелкой)</li><li>или меню <b>⋮</b> → <b>«Установить Niet Café»</b>.</li></ol>`,

/* ---- Web Push: уведомления при закрытом приложении ---- */
const VAPID=(typeof VAPID_KEY=='string'?VAPID_KEY:'').replace(/\s+/g,'');/* ключ задаётся в самом верху файла, в блоке VAPID_KEY */
let PUSHON=false;
const b64u=s=>{const b=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))},
pushRole=()=>me&&['waiter','kitchen','bar'].includes(me.role),
pushOk=()=>'serviceWorker' in navigator&&'PushManager' in window&&window.Notification&&location.protocol.startsWith('http');
async function pushOn(v){const t=m=>{if(v)toast(m)};
 try{
  if(!pushRole())return;
  if(!VAPID)return t('Push не настроен: не указан VAPID-ключ в index.html');
  if(!/^[A-Za-z0-9_-]{85,90}$/.test(VAPID))return t('VAPID-ключ вставлен неверно: нужен ПУБЛИЧНЫЙ ключ (около 87 символов), без пробелов и кавычек внутри');
  if(!pushOk())return t('Этот браузер не поддерживает push. На iPhone: «Поделиться» → «На экран Домой», затем открыть иконку');
  if(Notification.permission=='default')await Notification.requestPermission();
  if(Notification.permission!='granted')return t('Уведомления запрещены — разрешите их для этого сайта в настройках браузера');
  const reg=await navigator.serviceWorker.ready,key=b64u(VAPID);let s=await reg.pushManager.getSubscription();
  if(s){const k=s.options&&s.options.applicationServerKey;if(k&&(k.byteLength!=key.length||!new Uint8Array(k).every((x,i)=>x==key[i]))){await s.unsubscribe();s=null}}
  if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
  const j=s.toJSON(),r=await sb.rpc('push_register',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_ua:navigator.userAgent.slice(0,200)});
  if(r.error){PUSHON=false;return t('Push: выполните 7_push.sql в Supabase ('+r.error.message+')')}
  PUSHON=true;t('✅ Push включён — уведомления придут и при закрытом приложении')
 }catch(e){PUSHON=false;t('Не удалось включить push: '+(e.message||e))}}
function pushAuto(){if(pushRole()&&pushOk()&&Notification.permission=='granted')pushOn(false)}
async function pushOff(){PUSHON=false;if(!pushOk())return;const r=await navigator.serviceWorker.getRegistration(),s=r&&await r.pushManager.getSubscription();if(s)await sb.rpc('push_unregister',{p_endpoint:s.endpoint})}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
