/* v5: уведомления разных типов */
.toast{display:flex;align-items:center;gap:8px;border-left:6px solid #fff6;animation:tIn .35s cubic-bezier(.2,1.3,.4,1);cursor:pointer;transition:opacity .4s,transform .4s}.toast.out{opacity:0;transform:translate(-50%,16px)}
@keyframes tIn{from{opacity:0;transform:translate(-50%,40px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.toast.k-new{background:#c4661f;border-color:#ffd9b0}.toast.k-ready{background:#2e8f6b;border-color:#bff0dc}.toast.k-call{background:#2f63c8;border-color:#c9dbff;animation:tIn .35s cubic-bezier(.2,1.3,.4,1),tRing 1.2s .35s 3}
.toast.k-bill{background:#6a45c2;border-color:#e0d4ff;animation:tIn .35s cubic-bezier(.2,1.3,.4,1),tRing 1.2s .35s 3}.toast.k-gorder{background:#8c6450;border-color:#f0d9cc}.toast.k-delivery{background:#0f8a8a;border-color:#bdf2f2;animation:tIn .35s cubic-bezier(.2,1.3,.4,1),tBump .5s .35s 3}

.psec{border-radius:12px;padding:10px 12px;background:#f3f6f4;font-size:13px}.psec.ps-on{background:#e6f5ee}.psec.ps-off,.psec.ps-ios{background:#fff6d6}.psec.ps-denied,.psec.ps-nosup{background:#fde8e9}.psec details{margin-top:4px;color:#555}.psec summary{cursor:pointer;font-weight:600;color:#333}.psec ol{margin:6px 0 0 18px;padding:0;display:grid;gap:4px}.toast.k-low{background:#8a5a00;border-color:#ffe2a8}.toast.k-unstop{background:#2e8f6b;border-color:#c6efe3}.toast.k-test{background:#2f63c8;border-color:#cfe0ff}.sndb.k-low{background:#a8740a}.sndb.k-unstop{background:#2e8f6b}.sndb.k-test{background:#2f63c8}
.stz{color:#f5b400;letter-spacing:1px}.stz i{color:#ddd;font-style:normal}.clt td{vertical-align:top}.rvc.lo{border-left:4px solid var(--rd)}.rvc.dn{opacity:.6}.rvd{display:flex;align-items:center;gap:6px;font-size:12px}.rvd span{width:22px}.rvd em{flex:1;height:7px;border-radius:4px;background:#f1eee8;overflow:hidden}.rvd i{display:block;height:100%;background:#f5b400;min-width:2px}.rvd small{color:var(--mu)}
.whm{gap:6px;flex-wrap:wrap;margin-bottom:8px}.nb{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--rd);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:3px}.nb.o{background:#a8740a}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}.kp{margin:0}.kp b{display:block;font-size:22px;margin:2px 0}.kp small{color:var(--mu);font-size:11.5px}.kp.r{border-color:var(--rd)}.kp.r b{color:var(--rd)}.kp.a{border-color:#e0a63a}.kp.a b{color:#a8740a}.lowt tr.lv3 td,.lowt tr.lv2 td{background:#fdf1f0}.lowt tr.lv1 td{background:#fff8e6}.lvt{font-size:11.5px;font-weight:600}.lvt.warn{color:#a8740a}.pdel{margin-top:12px;border-style:dashed}
.sndm{position:fixed;right:12px;top:64px;z-index:30;max-height:calc(100vh - 80px);overflow:auto;background:#fff;border:1px solid var(--ln);border-radius:16px;box-shadow:0 12px 40px #0003;padding:14px;width:min(320px,calc(100vw - 24px));display:grid;gap:6px}

.sndb.k-new{background:#c4661f}.sndb.k-ready{background:#2e8f6b}.sndb.k-call{background:#2f63c8}.sndb.k-bill{background:#6a45c2}.sndb.k-gorder{background:#8c6450}.sndb.k-delivery{background:#0f8a8a}.sndb.k-take{background:#3d7d6b}.sndb.k-cancel{background:#b0484f}.sndb.k-stop{background:#5c1f24}.sndb.k-accepted{background:#4a4944}
